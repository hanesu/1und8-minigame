<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1und8 Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.1/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.1/maptiler-sdk.css" rel="stylesheet" />

  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="map.css">
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div id="map-container">
      <div id="opt-in-overlay">
        <div class="opt-in-content">
            <h2>Cookie Banner Opt-In</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus duis convallis tempus leo eu aenean sed diam urna tempor pulvinar vivamus fringilla lacus nec metus.</p>
            <button id="opt-in-button">Ich stimme zu</button>
        </div>
      </div>
      <div id="info-box" class="hidden">
        <div id="info-header">
          <div id=info-image></div>
          <div id="info-text-wrapper">
            <h2 id="info-title"></h2>
            <ul id="info-ul">
              <li> <img src="img/Haltestelle.svg" class="info-stations"> <p id="info-start"></p></li>
              <li> <img src="img/Haltestelle.svg" class="info-stations"> <p id="info-destination"></p></li>
            </ul>
          </div>
        </div>
        <p id="info-text"></p>
        <div id="poi-image-container"></div>
        <div id="info-button-wrapper">
          <button id="info-more">Mehr erfahren</button> <!-- href this -->
        </div>
      </div>
      <div id="map"></div>
      <div id="map-overlay"></div>
    </div>
    <div id="description-wrapper">
      <div class="person-icons">
        <!-- Icons injected via generatePersonIcons() in map.js -->
      </div>
    </div>
  </div>
  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"
    charset="utf-8"
></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
