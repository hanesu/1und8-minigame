<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1und8 Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.1/maptiler-sdk.umd.min.js"></script>
  <link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.1/maptiler-sdk.css" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css">
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <button id="startSimulation" class="control-button">Start Simulation</button>
      
      <div class="sliders">
          <div class="slider-container">
              <label for="giselaDelay">Gisela Delay: <span id="giselaValue">0</span>s</label>
              <input type="range" id="giselaDelay" min="0" max="30" value="0">
          </div>
          <div class="slider-container">
              <label for="annaDelay">Anna Delay: <span id="annaValue">15</span>s</label>
              <input type="range" id="annaDelay" min="0" max="30" value="15">
          </div>
          <div class="slider-container">
              <label for="maxDelay">Max Delay: <span id="maxValue">2</span>s</label>
              <input type="range" id="maxDelay" min="0" max="30" value="2">
          </div>
          <div class="slider-container">
              <label for="eliseDelay">Elise Delay: <span id="eliseValue">10</span>s</label>
              <input type="range" id="eliseDelay" min="0" max="30" value="10">
          </div>
          <div class="slider-container">
            <label for="jimDelay">Jim Delay: <span id="jimValue">6</span>s</label>
            <input type="range" id="jimDelay" min="0" max="30" value="6">
        </div>
      </div>
  </div>
    <div id="map"></div>
    <div id="description-wrapper">
      <div class="person-icons">
        <!-- Icons injected via generatePersonIcons() in map.js -->
      </div>
      <div class="description">
        <h1 id="desc-title"></h1>
        <p id="desc-info"></p>
      </div>
    </div>
  </div>
  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"
    charset="utf-8"
></script>
  <script src="/map.js"></script>
</body>
</html>
